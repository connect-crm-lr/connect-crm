spring:
  application:
    name: connect-crm

  # Lê as credenciais do mesmo .env usado pelo Docker
  config:
    import:
      - optional:file:../database/.env[.properties]
      - optional:file:./database/.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

server:
  port: 8080

# Origens que podem chamar a API (o front em dev roda no Vite, porta 5173).
# Para mais de uma, separar por virgula na variavel CORS_ALLOWED_ORIGINS.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Chave que assina o token JWT. Vem do database/.env (JWT_SECRET), nunca fixa no código.
  # Precisa ter pelo menos 32 caracteres (256 bits, exigência do HS256).
  jwt:
    secret: ${JWT_SECRET}
    expiracao-horas: ${JWT_EXPIRACAO_HORAS:8}
