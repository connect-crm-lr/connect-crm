spring:
  application:
    name: connect-crm

  # Lê as credenciais do mesmo .env usado pelo Docker
  config:
    import:
      - optional:file:../database/.env[.properties]
      - optional:file:./database/.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

server:
  port: 8080